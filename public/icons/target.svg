<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <!-- Center of target is at cx=56, cy=64 -->
  <!-- Ring 1 (Outer Blue) -->
  <circle cx="56" cy="64" r="48" fill="#2563EB" />

  <!-- Ring 2 (White) -->
  <circle cx="56" cy="64" r="38" fill="#FFFFFF" />

  <!-- Ring 3 (Middle Blue) -->
  <circle cx="56" cy="64" r="28" fill="#2563EB" />

  <!-- Ring 4 (Inner White) -->
  <circle cx="56" cy="64" r="18" fill="#FFFFFF" />

  <!-- Bullseye (Center Warm Red) -->
  <circle cx="56" cy="64" r="8" fill="#EF4444" />

  <!-- Dart Arrow Embedded in Center -->
  <!-- Shaft -->
  <line x1="56" y1="64" x2="88" y2="32" stroke="#334155" stroke-width="4.5" stroke-linecap="round" />

  <!-- Arrow Flights / Feathers (Yellow Warm) -->
  <!-- Top feather -->
  <polygon points="86,34 94,18 104,28 92,40" fill="#FBBF24" stroke="#334155" stroke-width="1.5" stroke-linejoin="round" />
  <!-- Bottom feather notch detail -->
  <polygon points="88,32 99,21 95,29 102,30 90,42" fill="#F59E0B" />
</svg>
