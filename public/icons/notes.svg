<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <!-- Warm Amber-Orange Circular Disk (softened for eye comfort) -->
  <circle cx="60" cy="60" r="54" fill="#F97316" />

  <!-- Spiral Notebook Sheet with softer rounded corners -->
  <rect x="36" y="24" width="46" height="66" rx="9" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.5" />

  <!-- Vertical Red Margin Line -->
  <line x1="44" y1="26" x2="44" y2="88" stroke="#EF4444" stroke-width="1.8" />

  <!-- Horizontal Ruled Paper Lines -->
  <line x1="45" y1="36" x2="75" y2="36" stroke="#334155" stroke-width="1.8" stroke-linecap="round" />
  <line x1="45" y1="44" x2="75" y2="44" stroke="#334155" stroke-width="1.8" stroke-linecap="round" />
  <line x1="45" y1="52" x2="75" y2="52" stroke="#334155" stroke-width="1.8" stroke-linecap="round" />
  <line x1="45" y1="60" x2="75" y2="60" stroke="#334155" stroke-width="1.8" stroke-linecap="round" />
  <line x1="45" y1="68" x2="75" y2="68" stroke="#334155" stroke-width="1.8" stroke-linecap="round" />
  <line x1="45" y1="76" x2="75" y2="76" stroke="#334155" stroke-width="1.8" stroke-linecap="round" />

  <!-- Spiral Wire Rings on Left -->
  <path d="M32 32H40M32 40H40M32 48H40M32 56H40M32 64H40M32 72H40M32 80H40" stroke="#1E293B" stroke-width="2.5" stroke-linecap="round" />

  <!-- Pencil Tilted at 45 Degrees -->
  <g transform="translate(68, 62) rotate(45)">
    <!-- Eraser (Soft Red) -->
    <rect x="-6" y="-30" width="12" height="8" rx="2" fill="#EF4444" stroke="#1E293B" stroke-width="1.8" />
    
    <!-- Metal Ferrule (Silver) -->
    <rect x="-6" y="-22" width="12" height="4" fill="#E2E8F0" stroke="#1E293B" stroke-width="1.4" />
    
    <!-- Pencil Body (Golden Amber) -->
    <rect x="-6" y="-18" width="12" height="24" fill="#FBBF24" stroke="#1E293B" stroke-width="1.8" />
    
    <!-- Wood Sharpened Tip -->
    <polygon points="-6,6 6,6 0,16" fill="#FEF3C7" stroke="#1E293B" stroke-width="1.8" stroke-linejoin="round" />
    
    <!-- Graphite Lead Tip -->
    <polygon points="-2.5,12 2.5,12 0,16" fill="#1E293B" />
  </g>
</svg>
